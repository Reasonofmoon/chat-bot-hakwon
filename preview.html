<!DOCTYPE html><html><head><title>Button Preview</title><style>
  body { font-family: sans-serif; padding: 20px; }
  .row { margin-bottom: 20px; }
  .label { display: inline-block; width: 200px; }
  button { padding: 8px 16px; border: 1px solid #ccc; background: #eee; border-radius: 4px; }
</style></head><body><h1>Button Preview</h1><div class="row"><span class="label">Default:</span><button type="button" style="display:inline-flex;align-items:center;justify-content:center;user-select:none;cursor:pointer" id="btn-default">Default Button</button></div><div class="row"><span class="label">Loading (start):</span><button type="button" disabled="" aria-busy="true" style="display:inline-flex;align-items:center;justify-content:center;user-select:none;cursor:wait" id="btn-loading"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="margin-right:0.5em;align-self:center"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" stroke-opacity="0.25"></circle><path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" stroke-width="4" stroke-linecap="round" style="will-change:transform"><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="1s" repeatCount="indefinite"></animateTransform></path></svg>Loading...</button></div><div class="row"><span class="label">Disabled:</span><button type="button" disabled="" style="display:inline-flex;align-items:center;justify-content:center;user-select:none;cursor:not-allowed" id="btn-disabled">Disabled Button</button></div><div class="row"><span class="label">Loading + Custom Cursor:</span><button type="button" disabled="" aria-busy="true" style="display:inline-flex;align-items:center;justify-content:center;user-select:none;cursor:wait" id="btn-custom-cursor"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="margin-right:0.5em;align-self:center"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" stroke-opacity="0.25"></circle><path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" stroke-width="4" stroke-linecap="round" style="will-change:transform"><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="1s" repeatCount="indefinite"></animateTransform></path></svg>Loading...</button></div></body></html>
